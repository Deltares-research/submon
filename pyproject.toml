[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geost"
dynamic = ["version"]
maintainers = [
    {name = "Erik van Onselen", email = "erik.vanonselen@deltares.nl"},
    {name = "Juliette Bleichrodt", email = "juliette.bleichrodt@deltares.nl"},
]
description = "Python package to monitor subsidence components"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
	"subsidence",
	"tectonics",
	"mining",
	"monitoring",
	"geology",
    "deltares",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyproj",
    "geopandas",
    "xlrd",
    "openpyxl",
	"rioxarray",
    "shapely",
]

[project.urls]
Homepage = "https://github.com/Deltares-research/submon"
Repository = "https://github.com/Deltares-research/submon"
Issues = "https://github.com/Deltares-research/submon/issues"

[tool.hatch.version]
path = "src/submon/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src/submon", "tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.13"
numpy = "*"
pyproj = "*"
geopandas = "*"
shapely = "*"
black = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
sphinx = "*"
pip = "*"
rioxarray = "*"
xarray = "*"
netcdf4 = "*"
dask = "*"
pydap = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx-design = "*"
myst-nb = "*"
pre-commit = "*"

[tool.pixi.pypi-dependencies]
submon = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m pytest --verbose --cov=geost --cov-report xml --cov-report term"
docs = "sphinx-build -b html docs ./docs/build"
format = "black ."
lint = "ruff check --fix ./src"
rm-jupyter = "rm -r ./docs/jupyter_execute"
rm-build = "rm -r ./docs/build"
rm-generated = "rm -r ./docs/api_reference/generated"
rebuild-docs = { depends-on = ["rm-jupyter", "rm-build", "rm-generated", "docs"] }

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "py314" }
py313 = { features = ["py313"], solve-group = "py313" }
py314 = { features = ["py314"], solve-group = "py314" }

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
	"unittest: test of single component",
	"integrationtest: test of multiple components",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "N", "I001", "NPY201"]
ignore = ["F401", "E402", "E501", "F811"]
unfixable = ["F401"]
pydocstyle.convention = "numpy"
